spring.application.name=ms-solicitudes
server.port=8082

# ---- Base de datos H2 guardada en archivo (los datos sobreviven al reinicio) ----
spring.datasource.url=jdbc:h2:file:./data/solicitudesdb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Consola web para ver las tablas: http://localhost:8082/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.application.name=ms-usuarios
server.port=8081

# ---- Base de datos H2 guardada en archivo (los datos sobreviven al reinicio) ----
spring.datasource.url=jdbc:h2:file:./data/usuariosdb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Consola web para ver las tablas: http://localhost:8081/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- JPA / Hibernate ----
# update: crea o ajusta las tablas a partir de las entidades sin borrar los datos
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
